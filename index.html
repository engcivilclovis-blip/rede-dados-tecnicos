<title>Sistema de Gestão</title>
<style>
  :root{
    --bg:#eef2f8; --card:#ffffff; --ink:#0f1e33; --muted:#5f6b7a;
    --line:#d8e1ef; --brand:#1d4ed8; --brand-dark:#0f2a63; --brand2:#0f2a63; --azul:#0aa2dc; --tan:#D4A373;
    --ok:#166534; --okbg:#dcfce7; --warn:#8a5a12; --warnbg:#fdf3d6;
    --erro:#991b1b; --errobg:#fee2e2; --neutro:#6b7280; --neutrobg:#eef2f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
  a{color:var(--azul)}
  .hidden{display:none!important}
  .topbar{background:linear-gradient(90deg,var(--brand-dark),var(--brand));color:#fff;height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;box-shadow:0 2px 10px rgba(27,67,50,.18)}
  .topbar .logo{font-weight:800;letter-spacing:1px;font-size:17px;display:flex;align-items:center;gap:8px}
  .topbar .sp{flex:1}
  .topbar .who{font-size:12px;opacity:.95}
  .btn{border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
  .btn.sec{background:#fff;color:var(--brand);border:1px solid var(--line)}
  .btn.azul{background:var(--azul)}
  .btn.zap{background:#25d366;color:#0b3d24}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 14px;display:flex;gap:16px}
  nav.side{width:190px;flex-shrink:0}
  nav.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:transparent;
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);margin-bottom:3px}
  nav.side button.on{background:var(--brand);color:#fff;font-weight:700}
  main{flex:1;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(27,67,50,.06)}
  h1{font-size:20px;margin:0 0 2px;color:var(--brand-dark)}
  h2{font-size:15px;margin:0 0 10px;color:var(--brand)}
  /* Cabeçalho de módulo (estilo banner) */
  .modbanner{background:linear-gradient(100deg,var(--brand-dark),var(--brand));border-radius:14px;padding:16px 20px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(27,67,50,.20)}
  .modbanner::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.05)}
  .modbanner .mtag{display:inline-block;background:var(--tan);color:#3a2a10;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 10px;border-radius:6px;margin-bottom:8px}
  .modbanner .mtit{font-size:22px;font-weight:800;line-height:1.15;position:relative}
  .modbanner .msub{font-size:13px;opacity:.92;margin-top:3px;position:relative}
  .modbanner .macoes{position:absolute;right:18px;bottom:16px}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 8px}
  label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 3px;font-weight:600}
  input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  textarea{resize:vertical;min-height:56px}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:720px){.wrap{flex-direction:column}.g2,.g3{grid-template-columns:1fr}nav.side{width:auto;display:flex;flex-wrap:wrap;gap:6px}}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.erro{background:var(--errobg);color:var(--erro)} .pill.neutro{background:var(--neutrobg);color:var(--neutro)}
  .pill.azul{background:#dbeafe;color:#1e40af}
  table.chk{width:100%;border-collapse:collapse}
  table.chk th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
  table.chk th:first-child{text-align:left}
  table.chk td{padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  table.chk td.c{text-align:center;width:80px}
  table.chk input[type=text]{padding:5px 7px;font-size:12px}
  .chkbox{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:4px 0;cursor:pointer}
  .chkbox input{margin-top:2px}
  .banner{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;border-left:4px solid}
  .banner.erro{background:var(--errobg);border-color:var(--erro);color:var(--erro)}
  .banner.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .banner.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
  .banner.info{background:#eaf1ff;border-color:var(--azul);color:#1e40af}
  .list-item{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff}
  .list-item:hover{border-color:var(--brand2)}
  .list-item .t{flex:1;min-width:0}
  .list-item .t b{font-size:14px} .list-item .t div{font-size:12px;color:var(--muted)}
  .muted{color:var(--muted)} .small{font-size:12px}
  .docfile{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
  .docfile .x{margin-left:auto;color:var(--erro);cursor:pointer;font-weight:700}
  .timeline{border-left:2px solid var(--line);margin:6px 0 0;padding-left:14px}
  .tl-item{position:relative;margin-bottom:12px;font-size:13px}
  .tl-item:before{content:"";position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
  .tl-when{color:var(--muted);font-size:11px;margin-bottom:2px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .calhead{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
  .calcell{min-height:76px;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--card,#fff);overflow:hidden}
  .calcell.empty{border:none;background:transparent}
  .calcell.hoje{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
  .caldia{font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:600}
  .calitem{font-size:11px;line-height:1.3;padding:2px 4px;border-radius:4px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .calitem.ok{background:#16a34a} .calitem.az{background:#0077B6} .calitem.wa{background:#e07830} .calitem.er{background:#e03030} .calitem.ne{background:#64748b}
  @media(max-width:640px){ .calcell{min-height:58px;padding:2px} .calitem{font-size:9px;padding:1px 3px} .caldia{font-size:10px} }
  .login{max-width:380px;margin:7vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 12px 40px rgba(31,42,48,.15)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .kv span:first-child{color:var(--muted)}
  .tag{font-size:11px;background:var(--neutrobg);color:var(--neutro);padding:2px 7px;border-radius:6px;font-weight:600}
  .demo{background:var(--warnbg);color:var(--warn);text-align:center;font-size:11px;padding:4px}
  .informe{background:var(--brand-dark);color:#eaf4ef;font-size:13px;padding:8px 18px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:default}
  .informe-tag{background:var(--tan);color:#3a2a08;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
  table.users{width:100%;border-collapse:collapse}
  table.users th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line)}
  table.users td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
</style>

function ehMobile(){ return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent); }
function ehIOS(){ try{ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }catch(e){ return false; } }
function jaInstalado(){ try{ return window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }catch(e){ return false; } }
function bannerPwaHtml(){
  if(jaInstalado()) return '';
  try{ if(localStorage.getItem('pwa_dismiss')==='1') return ''; }catch(e){}
  if(!ehMobile() && !deferredPrompt) return '';   // desktop só mostra se o navegador oferecer instalação
  return '<div id="pwaBanner" style="position:fixed;left:8px;right:8px;bottom:8px;z-index:9998;background:var(--brand-dark);color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.3)">'+

    '<button class="btn sm" style="background:#fff;color:var(--brand-dark)" onclick="instalarApp()">Instalar</button>'+
    '<button class="btn sm ghost" style="color:#fff" onclick="fecharPwa()">Agora não</button></div>';
}
function instalarApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); try{ deferredPrompt.userChoice.then(function(){ deferredPrompt=null; fecharPwa(); }); }catch(e){ deferredPrompt=null; } return; }
  if(ehIOS()){ alert('Para instalar no iPhone/iPad:\n\n1) Toque no botão Compartilhar (o quadradinho com a seta para cima ↑, embaixo).\n2) Role e toque em "Adicionar à Tela de Início".\n3) Toque em "Adicionar".'); return; }

function _roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function gerarIconeQuadrado(logoSrc, size, cb){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var cv=document.createElement('canvas'); cv.width=size; cv.height=size; var ctx=cv.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,size,size);                 // fundo branco (logo costuma ser sobre branco)
        var max=size*0.80, r=Math.min(max/img.width, max/img.height); var w=img.width*r, h=img.height*r;
        ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
        cb(cv.toDataURL('image/png'));
      }catch(e){ cb(null); }
    };
    img.onerror=function(){ cb(null); };
    img.src=logoSrc;
  }catch(e){ cb(null); }
}

    apiPost('uploadArquivo',{nome:file.name, base64:String(rd.result), mime:file.type||'application/octet-stream', privado:!!(opts&&opts.privado)}).then(function(r){

  var sel;
  if(!u.modulos || !u.modulos.length){ sel=modulosDoPapel(u.papel).slice(); } // sem config = padrão do papel
  else {
    sel=u.modulos.slice().filter(function(m){ return m!=="master"; }); // nunca conceder o painel Master
    Object.keys(MOD_PAI).forEach(function(comp){ if(sel.indexOf(MOD_PAI[comp])>-1 && sel.indexOf(comp)<0) sel.push(comp); }); // companheiros seguem o pai
  }
  // parceiro atribuído a um projeto/serviço vê a aba correspondente mesmo sem config
  if(sel.indexOf("proj")<0 && (projetos||[]).some(function(p){return (p.parceirosAtribuidos||[]).some(function(n){return eqNome(n,u.nome);});})) sel.push("proj");
  if(sel.indexOf("parceiros")<0 && ((trabalhos||[]).some(function(t){return (t.parceirosAtribuidos||[]).some(function(n){return eqNome(n,u.nome);});}) || (projetos||[]).some(function(p){return (p.parceirosAtribuidos||[]).some(function(n){return eqNome(n,u.nome);});}))) sel.push("parceiros");
  var ORD=["crm","diag","novo","fila","proj","novoproj","agro","novoagro","solic","portal","solicitar","parceiros","novoparc","campo","rede","mercado","servicos","master"];

function cpfOk(v){ var c=soDig(v); if(c.length!==11||/^(\d)\1{10}$/.test(c)) return false;
  for(var t=9;t<11;t++){ var s=0; for(var i=0;i<t;i++) s+=Number(c[i])*(t+1-i); if(((10*s)%11)%10!==Number(c[t])) return false; } return true; }
function cnpjOk(v){ var c=soDig(v); if(c.length!==14||/^(\d)\1{13}$/.test(c)) return false;
  function dv(n){ var p=n===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2], s=0; for(var i=0;i<n;i++) s+=Number(c[i])*p[i]; var r=s%11; return r<2?0:11-r; }
  return dv(12)===Number(c[12]) && dv(13)===Number(c[13]); }
function mascCad(el,tipo){

function validarCadLocal(o){
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email||"")) return ["email","Informe um e-mail válido."];
  if(o.tipo==="PJ"){
    if(!o.razaoSocial) return ["razaoSocial","Informe a razão social da empresa."];
    if(!cnpjOk(o.cnpj)) return ["cnpj","CNPJ inválido."];
    if((o.respNome||"").split(/\s+/).length<2) return ["respNome","Informe o nome completo do responsável legal."];
    if(!cpfOk(o.respCpf)) return ["respCpf","CPF do responsável inválido."];
  }
  if((o.nomeCompleto||"").split(/\s+/).length<2) return ["nomeCompleto","Informe o nome completo (nome e sobrenome)."];
  if(!cpfOk(o.cpf)) return ["cpf","CPF inválido. Confira os números."];
  if(soDig(o.telefone).length<10) return ["telefone","Informe o telefone com DDD."];
  if(PAPEIS_COM_REGISTRO.indexOf(user.papel)>-1 && !o.registro) return ["registro","Informe o registro profissional."];
  if(soDig(o.cep).length!==8) return ["cep","CEP inválido."];
  if(!o.logradouro) return ["logradouro","Informe a rua / estrada."];
  if(!o.numero) return ["numero","Informe o número (ou s/n)."];
  if(!o.bairro) return ["bairro","Informe o bairro / localidade."];
  if(!o.cidade) return ["cidade","Informe a cidade."];
  if(!/^[A-Z]{2}$/.test(o.uf||"")) return ["uf","UF inválida (ex.: PR)."];
  if(!o.declaracao) return ["declaracao","Marque a declaração de veracidade dos dados."];
  return null;
}
function salvarCadastroAcao(){
  var o=coletarCad(), er=validarCadLocal(o);
  if(er){ alert(er[1]); var e=document.getElementById("cd_"+er[0]); if(e) e.focus(); return; }
  var b=document.getElementById("btnCad"); if(b){ if(b.disabled) return; b.disabled=true; b.textContent="Salvando…"; }
  apiPost("salvarCadastro",{cadastro:o}).then(function(r){

var _ultAtiv=0;
function marcarAtividade(){
  if(!user||!TOKEN) return; var ag=Date.now(); if(ag-_ultAtiv<30000) return; _ultAtiv=ag;
  try{ var s=JSON.parse(sessionStorage.getItem('agt_sess')||'null'); if(s&&s.token){ s.lastAt=ag; sessionStorage.setItem('agt_sess', JSON.stringify(s)); } }catch(e){}

function sessaoValida(s){
  if(!s||!s.token||!s.user) return false;
  var ag=Date.now();
  if(s.lastAt && (ag - s.lastAt) > SESSAO_IDLE_MS) return false;   // +1h de inatividade -> pede senha
  if(s.loginDay && s.loginDay !== hojeStr()) return false;         // novo dia -> pede senha
  return true;
}

function salvarDiagAcao(silencioso){

  if(divergenciaAreas(edit)&&edit.pontos.indexOf("Divergência de área")===-1)edit.pontos.push("Divergência de área");
  var i=diagnosticos.findIndex(function(x){return x.id===edit.id;});
  if(i>-1)diagnosticos[i]=edit; else diagnosticos.push(edit);
  salvarDiag(); edit._novo=false;
  if(!silencioso){ alert("Diagnóstico salvo."); view="diag"; render(); }
  return true;
}
function encaminhar(){ if(!salvarDiagAcao(true))return; edit.status="Encaminhado ao engenheiro"; edit.encaminhadoEm=new Date().toISOString(); registrarMov(edit,"Encaminhado ao engenheiro"); salvarDiagAcao(true); alert("Encaminhado ao engenheiro."); view="diag"; render(); }

function gerarAcessoProdutor(id){

    if(!r||r.erro){ alert((r&&r.erro)||"Falha ao gerar o acesso."); return; }

function _fileInputMulti(cb){

/* ---------- CALENDÁRIO UNIFICADO (ordens de campo 📋 + agendamentos 📆) ----------
   Mesma fonte para as duas abas (Campo e Agendamentos): quem abrir qualquer um dos
   dois calendários vê TODOS os seus compromissos juntos, cada item no seu detalhe. */
function eventosUnificados(){
  var ev=[];
  (campos||[]).forEach(function(o){
    if(podeVerCampo(o)&&!o.arquivado&&o.dataAgendada){
      var nome=(o.cliente&&o.cliente.nome)||(o.imovel&&o.imovel.denominacao)||'Ordem';
      ev.push({data:o.dataAgendada, hora:o.horaAgendada||'', tipo:'campo', id:o.id, cls:campoCalCls(o.status), ico:'📋',
        label:nome, sub:(o.servico||''), status:o.status, onclick:"verCampo('"+o.id+"')",
        title:nome+' · '+(o.servico||'')+' · '+o.status});
    }
  });
  (compromissos||[]).forEach(function(c){
    if(participanteC(c)&&c.status!=="Recusado"&&c.status!=="Cancelado"&&c.data){
      var t=c.titulo||convLabelC(c);
      ev.push({data:c.data, hora:c.hora||'', tipo:'comprom', id:c.id, cls:comCalCls(c.status), ico:'📆',
        label:t, sub:(c.local||''), status:c.status, onclick:"verComprom('"+c.id+"')",
        title:t+' · '+c.status});
    }
  });
  // providências de projetos (item compartilhado) — aparecem no calendário de quem vê o projeto
  (projetos||[]).forEach(function(p){
    if(!podeVerProj(p))return;
    (p.providencias||[]).forEach(function(pr){
      if(!pr.data)return;
      ev.push({data:pr.data, hora:pr.hora||'', tipo:'providencia', id:p.id, cls:(pr.feito?'ok':'az'), ico:'🗓️',
        label:(pr.texto||'Providência'), sub:(p.nome||(p.imovel&&p.imovel.denominacao)||''), status:(pr.feito?'concluída':'agendada'),
        onclick:"verProj('"+p.id+"')", title:(pr.texto||'')+' · '+(p.nome||'')});
    });
  });
  return ev;
}
function calUnifGridHtml(ref, prefixo){
  var ano=ref.ano, mes=ref.mes;

  var porData={}; eventosUnificados().forEach(function(e){ (porData[e.data]=porData[e.data]||[]).push(e); });
  Object.keys(porData).forEach(function(k){ porData[k].sort(function(a,b){return (a.hora||'').localeCompare(b.hora||'');}); });
  var inicioSemana=new Date(ano,mes,1).getDay();
  var diasNoMes=new Date(ano,mes+1,0).getDate();
  var hojeStr=new Date().toISOString().slice(0,10);
  var h='<div class="row" style="justify-content:space-between;align-items:center;margin:10px 0"><h2 style="margin:0">'+meses[mes]+' '+ano+'</h2>'+
     '<div class="row" style="gap:6px"><button class="btn sm sec" onclick="'+prefixo+'CalMove(-1)">‹ Mês</button><button class="btn sm" onclick="'+prefixo+'CalHoje()">Hoje</button><button class="btn sm sec" onclick="'+prefixo+'CalMove(1)">Mês ›</button></div></div>';
  var dow=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  h+='<div class="calgrid">'+dow.map(function(x){return '<div class="calhead">'+x+'</div>';}).join("");
  for(var i=0;i<inicioSemana;i++) h+='<div class="calcell empty"></div>';
  for(var d=1;d<=diasNoMes;d++){
    var ds=ano+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var itens=porData[ds]||[];
    h+='<div class="calcell'+(ds===hojeStr?' hoje':'')+'"><div class="caldia">'+d+'</div>'+
      itens.map(function(e){
        return '<div class="calitem '+e.cls+'" onclick="'+e.onclick+'" title="'+esc(e.title)+'">'+e.ico+' '+esc((e.hora?e.hora+' ':'')+e.label)+'</div>';
      }).join("")+'</div>';
  }

/* ---- coordenadas: decimal->GMS e parser (KML / SIGEF / lista) ---- */
function _numBR(x){ var n=parseFloat(String(x==null?"":x).replace(',','.')); return isNaN(n)?null:n; }

function parseCoordText(txt){
  txt=String(txt||''); var out=[];
  var kml=txt.match(/<coordinates>([\s\S]*?)<\/coordinates>/gi);
  if(kml){ kml.forEach(function(b){ b.replace(/<\/?coordinates>/gi,'').trim().split(/\s+/).forEach(function(tok){ var p=tok.split(','); if(p.length>=2){ var lon=parseFloat(p[0]),lat=parseFloat(p[1]); if(isFinite(lon)&&isFinite(lat)) out.push({lon:lon,lat:lat}); } }); }); if(out.length) return _dedupFecha(out); }
  var dmsRe=/(-?\d{1,3})\s*[°º]\s*(\d{1,2})?\s*['′’]?\s*([\d.,]+)?\s*["″”]?\s*([NSEWLO])?/gi;
  txt.split(/[\r\n]+/).forEach(function(line){ line=line.trim(); if(!line)return;
    var dms=[],mm; dmsRe.lastIndex=0;
    while((mm=dmsRe.exec(line))){ if(mm[4]||mm[2]) dms.push({dec:_dmsToDec(mm[1],mm[2],mm[3],mm[4]), h:(mm[4]||'').toUpperCase()}); }
    if(dms.length>=2){ var lat=null,lon=null; dms.forEach(function(d){ if(d.h==='N'||d.h==='S')lat=d.dec; else if(d.h==='E'||d.h==='W'||d.h==='L'||d.h==='O')lon=d.dec; });

      if(lat!=null&&lon!=null){ out.push({lon:lon,lat:lat}); return; } }
    var dec=line.match(/-?\d+[.,]\d+/g);
    if(dec&&dec.length>=2){ var a=_numBR(dec[0]),b=_numBR(dec[1]),la,lo; if(Math.abs(a)>34){lo=a;la=b;}else{la=a;lo=b;} if(la!=null&&lo!=null) out.push({lon:lo,lat:la}); }

/* ---- croqui do perímetro a partir das coordenadas ---- */
function coordParaDec(str){ str=String(str||'').trim(); if(!str)return null;
  var m=str.match(/(-?\d+(?:[.,]\d+)?)\s*[°º]\s*(\d+(?:[.,]\d+)?)?\s*['′’]?\s*([\d.,]+)?\s*["″”]?\s*([NSEWLO])?/i);
  if(m&&(m[2]||m[4])) return _dmsToDec(m[1],m[2],m[3],m[4]);
  var d=parseFloat(str.replace(',','.')); return isNaN(d)?null:d; }

  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#ffffff"/>';
  s+='<polygon points="'+poly+'" fill="rgba(29,78,216,0.10)" stroke="#0f2a63" stroke-width="2"/>';
  pts.forEach(function(p){ var cx=X(p.x),cy=Y(p.y); s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3" fill="#b00020"/><text x="'+(cx+5).toFixed(1)+'" y="'+(cy-5).toFixed(1)+'" font-family="Arial" font-size="10" fill="#0f2a63">'+esc(p.cod||'')+'</text>'; });
  s+='<g transform="translate('+(W-26)+',30)"><line x1="0" y1="14" x2="0" y2="-8" stroke="#000" stroke-width="1.5"/><polygon points="0,-13 -4,-5 4,-5" fill="#000"/><text x="0" y="27" font-family="Arial" font-size="10" text-anchor="middle">N</text></g>';

  var elementos=(a.amostra||[]).map(function(e){
    var ar=num(e.areaM2), v=num(e.valor), raw=(ar&&v&&ar>0)?(v/ar):null;

  if(validos.length<2) return {n:validos.length,unitM2:null,saneada:[],removidos:[],elementos:elementos};
  var xs=validos.map(function(x){return x.xi;});

function comById(id){ return compromissos.find(function(x){return x.id===id;}); }
function ehEscritorioC(){ return ehMaster()||user.papel==="gestor"||user.papel==="atendente"||user.papel==="engenheiro"; }
function participanteC(c){ return eqNome(c.solicitante,user.nome)||eqNome(c.convidado,user.nome)||(c.convidado==='__ESCRITORIO__'&&ehEscritorioC()); }
function convLabelC(c){ return c.convidado==='__ESCRITORIO__'?'Escritório':(c.convidado||'—'); }
function podeResponderC(c){ // quem NÃO fez a proposta atual pode aceitar/sugerir; só enquanto pendente
  if(c.status!=='Solicitado' && c.status!=='Sugerida nova data') return false;
  if(!participanteC(c)) return false;
  return !eqNome(c.propostoPor,user.nome);
}

function foneComprom(c, alvo){ // alvo: 'convidado' | 'solicitante'
  if(alvo==='convidado') return c.convidado==='__ESCRITORIO__'?donoFone():foneDir(c.convidado);
  return foneDir(c.solicitante);
}
function avisarComprom(id){ var c=comById(id); if(!c)return;
  var alvo = eqNome(c.solicitante,user.nome) ? 'convidado' : 'solicitante';
  var msg="*"+(cfg.brand||"Sistema")+"* — Agendamento\n📆 "+(c.titulo||"")+"\n📅 "+brData(c.data)+(c.hora?(" "+c.hora):"")+(c.local?("\n📍 "+c.local):"")+"\n📌 "+c.status;
  abrirWa2(foneComprom(c,alvo), msg);
}
function gcalComprom(c){ var t=encodeURIComponent(c.titulo||"Agendamento"); var d=(c.data||"").replace(/-/g,""); var dates=d?("&dates="+d+"/"+d):""; var det=encodeURIComponent(c.descricao||""); var loc=encodeURIComponent(c.local||""); return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+t+dates+"&details="+det+"&location="+loc; }

/* =========================================================================
   COMUNIDADE — cooperativas/sindicatos/associações ↔ produtores
   Produtor solicita vínculo → organização aprova. Organização envia
   COMUNICADOS em massa + MENSAGENS individuais; produtor manda MENSAGEM/PEDIDO.
   Coleções: vinculos, comunicados, mensagenscoop. Recorte no servidor.
   ========================================================================= */
function byCriadoDesc(a,b){ return (b.criadoEm||"").localeCompare(a.criadoEm||""); }
function orgsDir(){ return (diretorio||[]).filter(function(u){return u.papel==='cooperativa';}); }
function orgTipoPorNome(nome){ var u=orgsDir().find(function(x){return eqNome(x.nome,nome);}); return (u&&u.tipoOrg)?orgTipoLabel(u.tipoOrg):""; }
function vincById(id){ return vinculos.find(function(x){return x.id===id;}); }
function msgCoopById(id){ return mensagensCoop.find(function(x){return x.id===id;}); }
function novoVinculo(org){ return {id:uid(),criadoEm:new Date().toISOString(),produtor:user.nome,organizacao:org,status:'Pendente'}; }
function novaMsgCoop(org,prod,tipo,de){ return {id:uid(),criadoEm:new Date().toISOString(),tipo:tipo,de:de,organizacao:org,produtor:prod,texto:'',item:'',qtd:'',resposta:'',status:(tipo==='pedido'?'Recebido':'')}; }

/* ---------- PRODUTOR (aparece no Portal) ---------- */
function produtorComunidadeHtml(){
  var meus=vinculos.filter(function(v){return eqNome(v.produtor,user.nome);});
  var aprov=meus.filter(function(v){return v.status==='Aprovado';});
  var pend=meus.filter(function(v){return v.status==='Pendente';});
  var jaOrg=meus.map(function(v){return (v.organizacao||'').toLowerCase();});
  var disp=orgsDir().filter(function(u){return jaOrg.indexOf(u.nome.toLowerCase())<0;});
  var h='<div class="card"><h2>🤝 Minha cooperativa / organização</h2>';
  if(!meus.length) h+='<div class="muted small">Você ainda não está vinculado a nenhuma organização.</div>';
  h+=aprov.map(function(v){var tp=orgTipoPorNome(v.organizacao);return '<div class="kv"><span>🍎 '+esc(v.organizacao)+(tp?(' <span class="tag">'+esc(tp)+'</span>'):'')+'</span><span class="pill ok">Associado</span></div>';}).join("");
  h+=pend.map(function(v){return '<div class="kv"><span>'+esc(v.organizacao)+'</span><span class="pill warn">Aguardando aprovação</span></div>';}).join("");
  if(disp.length){ h+='<div style="margin-top:8px"><label class="f">Vincular-se a uma organização</label><div class="row" style="gap:6px"><select id="selOrgVinc" style="flex:1"><option value="">— escolha —</option>'+disp.map(function(u){return '<option value="'+esc(u.nome)+'">'+esc(u.nome)+(u.tipoOrg?(' — '+esc(orgTipoLabel(u.tipoOrg))):'')+'</option>';}).join("")+'</select><button class="btn sm" onclick="solicitarVinculo()">Solicitar</button></div></div>'; }
  h+='</div>';
  if(aprov.length) h+=consentCardHtml(aprov);
  var orgsAprov=aprov.map(function(v){return (v.organizacao||'').toLowerCase();});
  var mural=comunicados.filter(function(c){ if(orgsAprov.indexOf((c.organizacao||'').toLowerCase())<0) return false; if(c.destinatarios&&c.destinatarios.length){ return c.destinatarios.some(function(n){return eqNome(n,user.nome);}); } return true; }).sort(byCriadoDesc);
  h+='<div class="card"><h2>📢 Mural de comunicados ('+mural.length+')</h2>'+(mural.length?mural.map(function(c){return '<div class="card" style="margin:0 0 8px;border-left:4px solid var(--brand)"><b>'+esc(c.titulo)+'</b> <span class="muted small">· '+esc(c.organizacao)+' · '+brData(c.criadoEm)+'</span>'+(c.texto?'<div class="small" style="margin-top:4px;white-space:pre-wrap">'+esc(c.texto)+'</div>':'')+(c.link?'<div style="margin-top:6px"><a class="btn sm sec" href="'+esc(c.link)+'" target="_blank">Abrir</a></div>':'')+'</div>';}).join(""):'<div class="muted small">Nenhum comunicado das suas organizações.</div>')+'</div>';
  if(aprov.length){
    h+='<div class="card"><h2>✉️ Falar com a organização</h2><div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="produtorMsg(\'mensagem\')">✉️ Enviar mensagem</button><button class="btn sm" onclick="produtorMsg(\'pedido\')">🛒 Fazer pedido de produto/serviço</button></div>';
    var minhas=mensagensCoop.filter(function(mm){return eqNome(mm.produtor,user.nome);}).sort(byCriadoDesc);
    h+=(minhas.length?('<div style="margin-top:8px">'+minhas.map(function(mm){return '<div class="kv"><span>'+(mm.tipo==='pedido'?('🛒 '+esc(mm.item)+(mm.qtd?(' ('+esc(mm.qtd)+')'):'')):('✉️ '+esc((mm.texto||'').slice(0,34))))+' · '+esc(mm.organizacao)+'</span><span>'+(mm.tipo==='pedido'?statusPill(mm.status):(mm.resposta?'<span class="pill ok">respondida</span>':brData(mm.criadoEm)))+'</span></div>'+(mm.resposta?'<div class="muted small" style="margin:-2px 0 6px">↳ '+esc(mm.resposta)+'</div>':'');}).join("")+'</div>'):'')+'</div>';
  }
  return h;
}
function solicitarVinculo(){ var el=document.getElementById('selOrgVinc'); var org=el?el.value:''; if(!org){alert('Escolha a organização.');return;} vinculos.push(novoVinculo(org)); salvarVinculos(); alert('Solicitação enviada. Aguarde a aprovação da organização.'); render(); }
/* ---- consentimento LGPD: produtor compartilha dados que ELE escolher ---- */
var TERMO_CONSENT="Autorizo o compartilhamento dos dados por mim selecionados abaixo com esta organização, para fins de gestão associativa e prestação de serviços. Declaro ciência de que posso revogar esta autorização a qualquer momento pelo próprio sistema, nos termos da LGPD (Lei nº 13.709/2018).";
function consentCardHtml(aprov){
  var h='<div class="card"><h2>🔐 Compartilhar meus dados</h2><p class="muted small">Você escolhe o que compartilhar com cada organização, mediante aceite do termo de ciência e autorização. Pode revogar quando quiser.</p>';
  aprov.forEach(function(v){
    var c=v.consent&&v.consent.aceito;
    h+='<div class="card" style="margin:8px 0 0;background:var(--surface2,#f7f9fc)"><div class="row" style="justify-content:space-between"><b>'+esc(v.organizacao)+'</b>'+(c?'<span class="pill ok">autorizado '+brData(v.consent.quando)+'</span>':'<span class="pill neutro">não compartilhado</span>')+'</div>';
    if(consentOrgSel===v.id){
      var cat=(v.consent&&v.consent.categorias)||{};
      h+='<div style="margin-top:8px">'+
        ['propriedade|Dados da propriedade','contato|Contato (nome e WhatsApp)','diagnosticos|Meus diagnósticos','documentos|Meus documentos'].map(function(x){var k=x.split('|')[0],l=x.split('|')[1];return '<label class="chkbox"><input type="checkbox" id="cs_'+k+'" '+(cat[k]?"checked":"")+'> '+l+'</label>';}).join("")+
        '<div class="card" style="margin:8px 0;font-size:12px;background:var(--card,#fff)">'+esc(TERMO_CONSENT)+'</div>'+
        '<label class="chkbox"><input type="checkbox" id="cs_aceite"> Li e <b>autorizo</b> (termo de ciência e autorização)</label>'+
        '<div class="row" style="gap:6px;margin-top:8px"><button class="btn sm" onclick="confirmarConsent(\''+v.id+'\')">Confirmar autorização</button><button class="btn sm sec" onclick="consentOrgSel=null;render()">Cancelar</button></div></div>';
    } else {
      h+='<div class="row" style="gap:6px;margin-top:8px">'+
        '<button class="btn sm" onclick="consentOrgSel=\''+v.id+'\';render()">'+(c?'Editar compartilhamento':'🔐 Compartilhar meus dados')+'</button>'+
        (c?'<button class="btn sm sec" onclick="revogarConsent(\''+v.id+'\')">Revogar</button>':'')+'</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}
function confirmarConsent(id){
  var v=vincById(id); if(!v)return;
  if(!(document.getElementById('cs_aceite')||{}).checked){ alert('Você precisa marcar “Li e autorizo” para compartilhar.'); return; }
  var cat={propriedade:!!(document.getElementById('cs_propriedade')||{}).checked, contato:!!(document.getElementById('cs_contato')||{}).checked, diagnosticos:!!(document.getElementById('cs_diagnosticos')||{}).checked, documentos:!!(document.getElementById('cs_documentos')||{}).checked};
  if(!cat.propriedade&&!cat.contato&&!cat.diagnosticos&&!cat.documentos){ alert('Selecione ao menos um tipo de dado para compartilhar.'); return; }
  var p=meuPerfil(); var dados={};
  if(cat.propriedade) dados.propriedade={propriedade:p.propriedade,municipioUf:p.municipioUf,matricula:p.matricula,area:p.area};
  if(cat.contato) dados.contato={nome:user.nome, fone:(p.fone||"")};
  if(cat.diagnosticos) dados.diagnosticos=meusDiag().map(function(d){return {imovel:d.cliente.nomeImovel||d.cliente.nome, status:d.status};});
  if(cat.documentos) dados.documentos=meusDocs().map(function(a){return a.nome;});
  v.consent={aceito:true, quando:new Date().toISOString(), termo:TERMO_CONSENT, categorias:cat, dados:dados};
  salvarVinculos(); consentOrgSel=null; alert('Dados compartilhados com '+v.organizacao+'. Você pode revogar quando quiser.'); render();
}
function revogarConsent(id){ var v=vincById(id); if(!v)return; if(!confirm('Revogar o compartilhamento de dados com '+v.organizacao+'?'))return; v.consent={aceito:false, revogadoEm:new Date().toISOString()}; salvarVinculos(); render(); }
function verDadosCompart(id){
  var v=vincById(id); if(!v||!v.consent||!v.consent.aceito){ alert('Este produtor não compartilhou dados.'); return; }
  logAcesso('Visualizou dados do produtor', v.produtor);
  var d=v.consent.dados||{}; var t="DADOS COMPARTILHADOS — "+v.produtor+"\nAutorizado em "+brDH(v.consent.quando)+"\n\n";
  if(d.propriedade) t+="🏡 Propriedade: "+(d.propriedade.propriedade||"—")+" · "+(d.propriedade.municipioUf||"")+" · matr. "+(d.propriedade.matricula||"—")+" · "+(d.propriedade.area||"—")+" ha\n";
  if(d.contato) t+="📞 Contato: "+(d.contato.nome||"")+" "+(d.contato.fone||"")+"\n";
  if(d.diagnosticos) t+="📋 Diagnósticos: "+(d.diagnosticos.length?d.diagnosticos.map(function(x){return x.imovel+" ("+x.status+")";}).join("; "):"nenhum")+"\n";
  if(d.documentos) t+="🗄️ Documentos: "+(d.documentos.length?d.documentos.join(", "):"nenhum")+"\n";
  t+="\n— Termo aceito: "+(v.consent.termo||"");
  alert(t);
}
function produtorMsg(tipo){
  var aprov=vinculos.filter(function(v){return eqNome(v.produtor,user.nome)&&v.status==='Aprovado';});
  if(!aprov.length){ alert('Você precisa estar associado a uma organização.'); return; }
  var org=aprov[0].organizacao;
  if(aprov.length>1){ org=prompt('Para qual organização?\n'+aprov.map(function(v){return v.organizacao;}).join('\n'),aprov[0].organizacao); if(!org)return; }
  var mm=novaMsgCoop(org,user.nome,tipo,'produtor');
  if(tipo==='pedido'){ var it=prompt('O que você precisa? (produto/serviço)'); if(!it)return; mm.item=it; mm.qtd=prompt('Quantidade (opcional):','')||''; mm.texto=prompt('Observações (opcional):','')||''; }
  else { var tx=prompt('Sua mensagem para a organização:'); if(!tx)return; mm.texto=tx; }
  mensagensCoop.push(mm); salvarMensagensCoop(); alert('Enviado à organização.'); render();
}

function aprovarVinculo(id){ var v=vincById(id); if(!v)return; v.status='Aprovado'; salvarVinculos(); renderMain(); }
function recusarVinculo(id){ var v=vincById(id); if(!v)return; v.status='Recusado'; salvarVinculos(); renderMain(); }
function removerVinculo(id){ var v=vincById(id); if(!v)return; if(!confirm('Remover este produtor da organização?'))return; apiRemover('vinculos',id); var i=vinculos.findIndex(function(x){return x.id===id;}); if(i>-1)vinculos.splice(i,1); renderMain(); }
var comWaId=null;
function addAssociado(){ var el=document.getElementById('selAddAssoc'); var nome=el?el.value:''; if(!nome){ alert('Escolha um produtor.'); return; }
  vinculos.push({id:uid(),criadoEm:new Date().toISOString(),produtor:nome,organizacao:user.nome,status:'Aprovado',adicionadoPeloEscritorio:true}); salvarVinculos();
  alert(nome+' foi vinculado(a) à comunidade.'); renderMain(); }
function coletarDestinatarios(){ var out=[]; try{ var els=document.querySelectorAll('.comChk'); Array.prototype.forEach.call(els,function(e){ if(e.checked) out.push(e.getAttribute('data-nome')); }); }catch(e){} return out; }
function marcarTodosCom(v){ try{ var els=document.querySelectorAll('.comChk'); Array.prototype.forEach.call(els,function(e){ e.checked=v; }); }catch(e){} }
function enviarComunicado(comWhats){
  var t=(document.getElementById('comTit')||{}).value||'', tx=(document.getElementById('comTxt')||{}).value||'', lk=(document.getElementById('comLink')||{}).value||'';
  if(!t.trim() && !tx.trim()){ alert('Escreva ao menos um título ou uma mensagem.'); return; }

function dpFilePick(inp){
  var files=inp&&inp.files; if(!files||!files.length)return;
  if(files.length===1){ uploadArquivoDrive(files[0],function(res){ var n=document.getElementById('dpNome'), l=document.getElementById('dpLink'); if(n&&!n.value.trim())n.value=res.nome; if(l)l.value=res.link; }); return; }
  // vários arquivos: envia cada um como documento ao destinatário escolhido
  var para=(document.getElementById('dpPara')||{}).value||'';
  if(!para){ alert('Escolha o destinatário antes de selecionar vários arquivos.'); inp.value=''; return; }
  var desc=((document.getElementById('dpDesc')||{}).value||'').trim();
  var arr=Array.prototype.slice.call(files), enviados=0;
  function next(){
    if(!arr.length){ alert(enviados+' documento(s) enviado(s) a '+para+'.'); renderMain(); return; }
    var f=arr.shift();
    uploadArquivoDrive(f,function(res){
      var d={id:uid(),criadoEm:new Date().toISOString(),de:user.nome,dePapel:user.papel,produtor:para,nome:res.nome,link:res.link,descricao:desc,noCofre:false,tipo:'envio'};
      docsProd.push(d); apiSalvarDoc('docsprod',d); enviados++;
      var av=document.getElementById('upStatus'); if(av)av.textContent=arr.length?('Restam '+arr.length+'...'):'';
      next();
    });
  }
  next();
}

function addPrestador(){ var n=(document.getElementById("npNome")||{}).value; if(!n||!n.trim()){alert("Informe o nome.");return;}
  prestadores.push({id:uid(),nome:n.trim(),cat:document.getElementById("npCat").value,cidade:(document.getElementById("npCidade")||{}).value||"",fone:(document.getElementById("npFone")||{}).value||"",cred:true,destaque:false,desc:(document.getElementById("npDesc")||{}).value||""}); salvarPrest(); renderMain(); }
function toggleCred(id){ var p=prestadores.find(function(x){return x.id===id;}); if(p){p.cred=!p.cred; salvarPrest(); renderMain();} }
function toggleDestaque(id){ var p=prestadores.find(function(x){return x.id===id;}); if(p){p.destaque=!p.destaque; salvarPrest(); renderMain();} }
function removerPrest(id){ if(!confirm("Remover este prestador?"))return; prestadores=prestadores.filter(function(p){return p.id!==id;}); apiRemover('prestadores',id); renderMain(); }
function prestLogoUpload(id){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(e){ var f=e.target.files[0]; if(!f)return; var r=new FileReader();
    r.onload=function(ev){ var img=new Image(); img.onload=function(){
      var max=180, w=img.width, h=img.height, sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      var p=prestadores.find(function(x){return x.id===id;}); if(p){ p.logo=cv.toDataURL('image/jpeg',0.72); salvarPrest(); renderMain(); }
    }; img.src=ev.target.result; };
    r.readAsDataURL(f); };
  inp.click();
}

function salvarMarca(){ cfg.brand=document.getElementById("cfgBrand").value.trim()||"Sistema"; cfg.tagline=document.getElementById("cfgTag").value.trim(); salvarCfg(); aplicarTituloGuia(); salvarMarcaCache(); render(); }
function subirLogo(){
  var f=document.getElementById("logoFile"); if(!f||!f.files||!f.files[0])return;
  var file=f.files[0];
  if(file.size>500*1024){ if(!confirm("A imagem tem "+Math.round(file.size/1024)+" KB. Recomendado até ~200 KB. Continuar?"))return; }
  var rd=new FileReader();
  rd.onload=function(){ cfg.logo=rd.result; apiConfig('logo',cfg.logo); salvarMarcaCache(); render(); alert("Logo atualizado. Já aparece no topo e no login."); };
  rd.readAsDataURL(file);
}
function removerLogo(){ cfg.logo=""; apiConfig('logo',''); salvarMarcaCache(); render(); }
function addInforme(){
  var t=document.getElementById("infTitulo").value.trim(); if(!t){ alert("Informe o título."); return; }
  var it={id:uid(),titulo:t,link:document.getElementById("infLink").value.trim(),texto:document.getElementById("infTexto").value.trim()};
  informes.push(it); apiSalvarDoc('informes',it); renderMain();
}
function removerInforme(id){ informes=informes.filter(function(x){return x.id!==id;}); apiRemover('informes',id); renderMain(); }
function toggleEsc(id){ cfg.bloqueados=cfg.bloqueados||[]; var i=cfg.bloqueados.indexOf(id); if(i>-1)cfg.bloqueados.splice(i,1); else cfg.bloqueados.push(id); salvarCfg(); renderMain(); }
function toggleUser(id){ var u=usuarios.find(function(x){return x.id===id;}); if(!u||u.papel==="master")return; u.ativo=!u.ativo; apiSalvarDoc('usuarios',u); renderMain(); }
function addUser(){ var n=document.getElementById("nuNome").value.trim(), pin=document.getElementById("nuPin").value.trim(), pp=document.getElementById("nuPapel").value, em=(document.getElementById("nuEmail")||{}).value||"";
  em=em.trim().toLowerCase();
  if(!n||!pin){ alert("Informe nome e senha inicial."); return; }
  if(!/^\S{4,20}$/.test(pin)){ alert("A senha deve ter de 4 a 20 caracteres, sem espaços."); return; }
  var ve=validarEmailUsuario(em, null, pp); if(ve){ alert(ve); return; }
  var novo={id:uid(),nome:n,pin:pin,papel:pp,email:em,ativo:true}; usuarios.push(novo); apiSalvarDoc('usuarios',novo); masterModEdit=novo.id; renderMain(); }
function validarEmailUsuario(em, id, papel){
  if(!em) return papel==="produtor" ? "" : "Informe o e-mail: ele é o login do usuário.";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return "E-mail inválido.";
  var dup=usuarios.find(function(x){ return x.id!==id && String(x.email||"").trim().toLowerCase()===em; });
  return dup ? ("Este e-mail já está cadastrado para "+(dup.nome||"outro usuário")+".") : "";
}
function editarUsuario(id){
  var u=usuarios.find(function(x){return x.id===id;}); if(!u)return;
  var nome=prompt("Nome do usuário:", u.nome); if(nome===null)return;
  var em=prompt("E-mail do usuário (é o login):", u.email||""); if(em===null)return;
  em=(em||"").trim().toLowerCase(); var ve=validarEmailUsuario(em, u.id, u.papel); if(ve){ alert(ve); return; }
  var pin=prompt("Senha do usuário (4 a 20 caracteres):", u.pin); if(pin===null)return;
  pin=(pin||"").trim(); if(!/^\S{4,20}$/.test(pin)){ alert("A senha deve ter de 4 a 20 caracteres, sem espaços."); return; }
  if(["master","gestor","atendente"].indexOf(u.papel)<0){
    var pa=prompt("Mensalidade paga até (dd/mm/aaaa). Vencida = o parceiro não baixa nenhuma entrega. Vazio = sem controle:", u.pagoAte?u.pagoAte.split("-").reverse().join("/"):""); if(pa===null)return;
    pa=(pa||"").trim(); if(pa){ var mm=pa.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!mm){ alert("Data inválida. Use dd/mm/aaaa."); return; }
      u.pagoAte=mm[3]+"-"+("0"+mm[2]).slice(-2)+"-"+("0"+mm[1]).slice(-2); } else { delete u.pagoAte; } }
  u.nome=(nome.trim()||u.nome); u.pin=pin; u.email=em; apiSalvarDoc('usuarios',u); renderMain(); alert("Usuário atualizado.");
}

  var mods=modulosSelecionaveis(u.papel);
  if(!mods.length) return '<div class="banner info" style="margin-top:10px">Papel sem módulos configuráveis.</div>';
  var atual=u.modulos ? u.modulos : modulosDoPapel(u.papel);  // sem config = começa pelo padrão do papel
  var chks=mods.map(function(m){ var on=atual.indexOf(m)>-1; var lbl=(NAVLBL[m]||{}).l||m;
    return '<label class="chkbox"><input type="checkbox" id="mod_'+m+'" '+(on?"checked":"")+'> '+lbl+'</label>'; }).join("");
  return '<div class="card" style="margin-top:10px;border-left:4px solid var(--brand)"><h3>Módulos de: '+esc(u.nome)+' · '+esc(PAPEIS[u.papel].nome)+'</h3>'+
    '<div class="grid g2">'+chks+'</div><div style="height:8px"></div>'+
    '<button class="btn sm" onclick="salvarModulos(\''+u.id+'\')">Salvar módulos</button> '+
    '<button class="btn sm sec" onclick="setMasterMod(\''+u.id+'\')">Fechar</button>'+
    '<p class="muted small" style="margin-top:6px">Marque QUALQUER módulo que este usuário poderá acessar — vale exatamente o que ficar marcado (o financeiro continua protegido pelo papel). Ex.: dar “Rede de Dados” a um Parceiro de Campo.</p></div>';
}
function salvarModulos(id){
  var u=usuarios.find(function(x){return x.id===id;}); if(!u)return;
  u.modulos=modulosSelecionaveis(u.papel).filter(function(m){ var el=document.getElementById('mod_'+m); return el&&el.checked; });
  apiSalvarDoc('usuarios',u); masterModEdit=null; renderMain(); alert('Módulos atualizados para '+u.nome+'.');
}

// PWA: meta tags que o Apps Script NÃO permite via addMetaTag são injetadas aqui no <head>.
(function injetarMetaPWA(){
  try{
    var metas=[['theme-color','#0f2a63'],['apple-mobile-web-app-status-bar-style','black-translucent'],['apple-mobile-web-app-title','Sistema']];
    metas.forEach(function(mt){
      if(document.querySelector('meta[name="'+mt[0]+'"]'))return;

})();

try{ montarPWADinamico(); }catch(e){}
render();
carregarCfg().then(function(){
  try{ localStorage.removeItem('agt_sess'); }catch(e){}   // sessões antigas (compartilhadas entre guias) são descartadas
  var s=null; try{ s=JSON.parse(sessionStorage.getItem('agt_sess')||'null'); }catch(e){}
  if(sessaoValida(s)){                          // login automático só dentro de 1h de atividade e no mesmo dia
    conviteToken=null;
    user=s.user; TOKEN=s.token; _ultAtiv=Date.now(); salvarSessao();
    if(user.pinTrocadoEm){ try{ var dias=Math.floor((Date.now()-new Date(String(user.pinTrocadoEm).slice(0,10)+'T00:00:00').getTime())/86400000); if(dias>=60) user.pinVencido=true; }catch(e){} }
    if(user.precisaCadastro && !user.pinVencido){ fluxoLogin='cadastro'; render(); return; }
    view=navFor(user)[0]||""; carregando=true; render();
    carregarDados().then(function(){ carregando=false; render(); });
  } else {
    if(s) limparSessao();
    if(!conviteToken){ try{ var _cv=localStorage.getItem('agt_convite'); if(_cv) conviteToken=_cv; }catch(e){} }
    if(conviteToken){ iniciarConvite(); }              // produtor: volta pela senha do convite
    else if(!user){ render(); }                        // sessão expirada (1h ou novo dia) -> pede senha
  }
});
